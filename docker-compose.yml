version: '3.8'

services:
  zingg_worker:
    build:
      context: ./zingg_worker
      dockerfile: Dockerfile
    container_name: cyber_zingg_worker
    ports:
      - "8001:8001"
    volumes:
      - ./data_files:/data_files
      - ./backend/zingg_output_models:/app/zingg_output_models
    restart: always
  fastapi_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyber_investigation_backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
    depends_on:
      - mongodb
      - neo4j
    volumes:
      - ./backend:/app
      - ./data_files:/data_files
    restart: always

  nextjs_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyber_investigation_frontend
    ports:
      - "3000:3000"
    depends_on:
      - fastapi_backend
    environment:
      - NEXT_PUBLIC_API_URL=http://fastapi_backend:8000
    restart: always

  mongodb:
    image: mongo:6.0
    container_name: cyber_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  neo4j:
    image: neo4j:5.12-community
    container_name: cyber_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
    volumes:
      - neo4j_data:/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: cyber_redis
    ports:
      - "6379:6379"

volumes:
  mongo_data:
  neo4j_data:



